[project]
name = "classifier-service"
version = "0.1.0"
description = "The LLM feature under test: classifies customer support emails"
requires-python = ">=3.13"
dependencies = [
  "shared",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "openai>=1.40",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classifier_service"]
