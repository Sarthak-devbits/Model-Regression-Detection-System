[project]
name = "orchestrator"
version = "0.1.0"
description = "Front-door API: creates eval runs, dispatches work, serves results"
requires-python = ">=3.13"
dependencies = [
  "shared",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "celery[redis]>=5.4",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
