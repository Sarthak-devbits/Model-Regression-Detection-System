name: regci

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  classifier:
    build:
      context: ..
      dockerfile: services/classifier/Dockerfile
    image: regci/classifier:dev
    env_file:
      - ../.env
    environment:
      SERVICE_NAME: classifier
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

volumes:
  redis_data:
