[project]
name = "llm-regression-ci"
version = "0.1.0"
description = "CI/CD for LLM behavior: detect prompt and model regressions"
requires-python = ">=3.13"
dependencies = ["shared", "classifier-service"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.6",
  "pre-commit>=3.7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/shared", "services/classifier"]

[tool.uv.sources]
shared = { workspace = true }
classifier-service = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "classifier_service"]

[tool.pytest.ini_options]
testpaths = ["libs", "services"]
addopts = "-ra -q --import-mode=importlib"
asyncio_mode = "auto"
