[project]
name = "llm-regression-ci"
version = "0.1.0"
description = "CI/CD for LLM behavior: detect prompt and model regressions"
requires-python = ">=3.13"
dependencies = ["shared"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
  "pre-commit>=3.7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/shared"]

[tool.uv.sources]
shared = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["shared"]

[tool.pytest.ini_options]
testpaths = ["libs"]
addopts = "-ra -q --import-mode=importlib"
